
name: Sync Upstream

on:
  schedule:
    # 每天北京时间 11:17 自动同步
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/OpenListTeam/OpenList-Worker.git
          git fetch upstream

      - name: Sync main branch
        run: |
          git checkout main
          git merge --ff-only upstream/main
          git push origin main
